name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build (Windows x86 Release)
    runs-on: windows-latest

    env:
      VCPKG_DEFAULT_TRIPLET: x86-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '81e3c888ef717a026eb57bb2f3cb0dbd30246271'

      - name: Configure CMake
        run: |
          cmake -B out/build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x86-windows `
            -G Ninja
        shell: pwsh

      - name: Build
        run: cmake --build out/build --config Release --verbose

      - name: Package release
        run: |
          # Copy built binaries
          New-Item -ItemType Directory -Force -Path "out/release/RMModLoader"
          Copy-Item "out/build/ModLoader.dll" "out/release/RMModLoader/"
          Copy-Item "out/build/Loader.exe" "out/release/RMModLoader/"

          # Copy mod_loader content
          Copy-Item -Recurse "mod_loader" "out/release/RMModLoader/"

          # Copy required runtime DLLs (vcpkg dependencies)
          $vcpkg_installed = "out/build/vcpkg_installed/x86-windows/bin"
          if (Test-Path $vcpkg_installed) {
            Copy-Item "$vcpkg_installed/*.dll" "out/release/RMModLoader/" -ErrorAction SilentlyContinue
          }
          
      - name: Get version from CMakeLists.txt
        id: get_version
        shell: pwsh
        run: |
          $content = Get-Content -Path CMakeLists.txt -Raw
          if ($content -match 'project\s*\([^)]*VERSION\s+(\d+(?:\.\d+)+)') {
            $version = $matches[1]
            Write-Host "Found version: $version"
            echo "version=$version" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "::error::Version not found in CMakeLists.txt"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModLoader-v${{ steps.get_version.outputs.version }}
          path: out/release/RMModLoader

      - name: Compress to 7z
        run: |
          & "C:\Program Files\7-Zip\7z.exe" a -t7z -mx=9 "ModLoader-v${{ steps.get_version.outputs.version }}.7z" ".\out\release\RMModLoader\*"
        shell: pwsh

      - name: SHA256 checksum
        shell: pwsh
        run: |
          $file = "ModLoader-v${{ steps.get_version.outputs.version }}.7z"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $file).Hash.ToLower()
          # sha256sum-style sidecar: "<hash>  <filename>"
          Set-Content -Path "$file.sha256" -Value "$hash  $file" -Encoding ascii -NoNewline
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "SHA256 ($file): $hash"

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/release/RMModLoader/ModLoader.dll
            out/release/RMModLoader/Loader.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ModLoader-v${{ steps.get_version.outputs.version }}.7z
            ModLoader-v${{ steps.get_version.outputs.version }}.7z.sha256
          name: v${{ steps.get_version.outputs.version }}
          tag_name: v${{ steps.get_version.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: true
